<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Yuki - Skill Scene</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0d0d0d; color:#D6D6D6; font:13px/1.4 system-ui, sans-serif; overflow:hidden; }
  #stage { position:absolute; inset:0 0 38px 0; }
  #c { display:block; width:100%; height:100%; }
  #cutin { position:absolute; inset:0; margin:auto; max-width:100%; max-height:100%; }
  #bar { position:absolute; left:0; right:0; bottom:0; height:38px; display:flex; align-items:center; gap:10px;
         padding:0 10px; background:#141414; border-top:1px solid rgba(255,255,255,.08); }
  #play { flex:none; width:28px; height:24px; background:#1d1d1d; border:1px solid rgba(255,255,255,.12);
          border-radius:5px; color:#D6D6D6; font-size:11px; cursor:pointer; }
  #seek { flex:1; min-width:60px; accent-color:#3D6AFF; cursor:pointer; }
  #time { flex:none; color:#8C8C8C; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#5A5A5A; }
  #msg[hidden] { display:none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><img id="cutin" alt="" hidden></div>
<div id="bar">
  <button id="play" title="Play/Pause">&#10073;&#10073;</button>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <span id="time">loading&hellip;</span>
</div>
<div id="msg">Loading&hellip;</div>
<script src="spine-webgl.js"></script>
<script>
"use strict";
/* Yuki (1057) full skill scene - plays the game's own spine layers in sequence.
   Staging follows the pack's real configs: layer ORDER is the z value from the
   .cfx files, and the ux action phases off the camera_node timeline (its keys
   start at 1.7667s into the ux shot) and the screen_2.cfx delay (35f @60fps).
   Fields: slug#anim#start#dur#end ("hide" only for one-shot flashes; every other
   layer plays once and HOLDS its last pose, like the game). Dev knob:
   ?d=slug:delta;slug:delta shifts any layer's start without editing this file. */
var CFG = [
  /* phase A - cut-in (z: -10 .. 5) */
  ["ug_intro_bg",  "animation",  0.00, 1.53, ""],
  ["ug_cutin1_b",  "animation",  0.08, 2.13, "hide"],
  ["ug_cutin1_m",  "animation",  0.12, 2.17, "hide"],
  ["ug_cutin1_f",  "animation",  0.16, 2.27, "hide"],
  ["ug_cutin2_f",  "animation",  0.10, 2.00, "hide"],
  /* phase B - ux composite scene, draw order = real z (scene first) */
  ["ux_bg1_1",     "animation",  1.35, 1.30, ""],
  ["ux_bg4_b",     "animation3", 1.45, 3.33, ""],
  ["ux_b1_2",      "animation",  3.10, 2.60, ""],
  ["ux_bg4_2",     "animation",  1.45, 2.33, ""],
  ["ux_bg4_3",     "animation",  1.48, 2.33, ""],
  ["ux_bg4_4",     "animation",  1.51, 2.33, ""],
  ["ux_bg4_1",     "animation",  1.54, 2.33, ""],
  ["ux_bg4_f",     "animation",  1.57, 2.47, ""],
  ["ux_b1_1",      "animation",  3.15, 2.93, ""],
  ["ux_bg3",       "animation",  1.60, 1.13, ""],
  ["ux_bg2",       "animation",  1.75, 0.73, ""],
  ["ux_bg1_2",     "animation",  1.98, 0.33, ""],
  ["ux_self_1_b",  "animation",  3.05, 0.97, ""],
  ["ux_self_2_b",  "animation",  3.60, 0.53, ""],
  ["ux_cutin_ch",  "animation",  3.10, 2.53, ""],
  ["ux_cutin_f",   "animation",  3.13, 2.53, ""],
  ["ux_self_1_f",  "animation",  3.08, 0.97, ""],
  ["ux_self_2_f",  "animation",  3.65, 0.33, ""],
  ["ux_f1_2",      "animation",  3.28, 2.93, ""],
  ["ux_f1_1",      "animation",  3.25, 2.63, ""],
  ["ux_f2_2",      "animation",  3.38, 2.63, ""],
  ["ux_f2_1",      "animation",  3.35, 2.63, ""],
  /* screen group (from ux_screen_1/2.cfx) - flashes/reticle composite OVER the scene */
  ["ux_screen2",   "animation",  3.68, 3.50, ""],
  ["ux_impactframe1_1", "animation", 3.12, 0.37, "hide"],
  ["ux_impactframe1_2", "animation", 3.16, 0.60, "hide"],
  ["ux_impactframe2",   "animation", 3.35, 3.00, "hide"],
  ["ux_screen1",   "animation",  1.33, 1.00, "hide"]
];
/* ?d=slug:delta;slug:delta - dev-only delay overrides */
var D = {};
(function () {
  var m = location.search.match(/[?&]d=([^&]+)/);
  if (m) decodeURIComponent(m[1]).split(";").forEach(function (kv) {
    var p = kv.split(":");
    if (p[0]) D[p[0]] = parseFloat(p[1]) || 0;
  });
})();
var CUTIN_WEBP = "cutins/1057_fhd.webp";
var CUTIN_UNTIL = 1.40;
var TOTAL = 7.20;
var DESIGN_W = 1580, DESIGN_H = 720;

var canvas = document.getElementById("c");
var cutinEl = document.getElementById("cutin");
var gl = canvas.getContext("webgl", { alpha: true, premultipliedAlpha: true })
      || canvas.getContext("experimental-webgl", { alpha: true, premultipliedAlpha: true });
var renderer = new spine.webgl.SceneRenderer(canvas, gl);
var rigs = [];
var t = 0, playing = true, last = 0, ready = false;

function loadRig(cfg, attempt) {
  attempt = attempt || 0;
  return new Promise(function (resolve, reject) {
    var m = new spine.webgl.AssetManager(gl, "scene/yuki_1057/" + cfg[0] + "/");
    m.loadText("skeleton.json");
    m.loadTextureAtlas("skeleton.atlas");
    function tick() {
      if (!m.isLoadingComplete()) { setTimeout(tick, 30); return; }
      try {
        if (m.hasErrors && m.hasErrors()) { reject(new Error("load " + cfg[0])); return; }
        var raw = JSON.parse(m.get("skeleton.json"));
        var data = new spine.SkeletonJson(new spine.AtlasAttachmentLoader(m.get("skeleton.atlas")))
          .readSkeletonData(raw);
        var sk = new spine.Skeleton(data);
        var skin = data.findSkin ? (data.findSkin("normal") || data.defaultSkin) : null;
        if (skin) sk.setSkin(skin);
        /* game rigs leave slot.attachment empty for many FX rigs; the setup
           attachment only exists in the skin (keyed by slot name). Assign the
           first skin attachment per empty slot, or the skeleton draws nothing. */
        var skinsRaw = raw.skins;
        if (skinsRaw) {
          var skMap = null;
          if (skinsRaw.length) { skMap = skinsRaw[0].attachments || null; }
          else { for (var sn in skinsRaw) { skMap = skinsRaw[sn].attachments || skinsRaw[sn]; break; } }
          if (skMap) {
            for (var si = 0; si < sk.slots.length; si++) {
              var sd = sk.slots[si].data;
              if (!sd.attachmentName && skMap[sd.name]) {
                for (var an in skMap[sd.name]) { sd.attachmentName = an; break; }
              }
            }
          }
        }
        sk.setSlotsToSetupPose();
        var st = new spine.AnimationState(new spine.AnimationStateData(data));
        var anim = null;
        for (var i = 0; i < data.animations.length; i++) if (data.animations[i].name === cfg[1]) anim = data.animations[i];
        if (!anim && data.animations.length) anim = data.animations[0];
        st.setAnimation(0, anim.name, false);
        resolve({ sk: sk, st: st, start: cfg[2] + (D[cfg[0]] || 0), dur: cfg[3], endHide: cfg[4] === "hide", hidden: false, slug: cfg[0] });
      } catch (e) { reject(e); }
    }
    tick();
  }).catch(function (e) {
    /* one flaky asset must not kill the whole scene: retry once, then skip */
    if (attempt < 1) { return loadRig(cfg, attempt + 1); }
    console.warn("scene layer skipped:", cfg[0], e && e.message);
    return null;
  });
}

/* load in small batches: fewer simultaneous connections, still parallel enough */
(function loadBatch(i) {
  if (i >= CFG.length) return Promise.resolve();
  return Promise.all(CFG.slice(i, i + 4).map(function (c) { return loadRig(c); }))
    .then(function (list) {
      for (var k = 0; k < list.length; k++) if (list[k]) rigs.push(list[k]);
      if (i === 0) { seek(0); requestAnimationFrame(loop); }
      return loadBatch(i + 4);
    });
})(0).then(function () {
  ready = true;
  document.getElementById("msg").hidden = true;
  seek(0);
}).catch(function (e) {
  document.getElementById("msg").textContent = "Load error: " + ((e && e.message) || e);
});

function apply(r, tt) {
  var local = tt - r.start;
  if (local < 0) { r.hidden = true; return; }
  if (r.endHide && local > r.dur) { r.hidden = true; return; }
  r.hidden = false;
  var e = r.st.getCurrent(0);
  if (e) e.trackTime = Math.min(local, r.dur);
  r.st.update(0);
  r.st.apply(r.sk);
  r.sk.updateWorldTransform();
}
function seek(tt) {
  t = tt;
  for (var i = 0; i < rigs.length; i++) apply(rigs[i], tt);
  /* cut-in webp overlay during phase 1; restart it when re-entering */
  var showCutin = tt < CUTIN_UNTIL;
  if (showCutin && cutinEl.hidden) { cutinEl.src = CUTIN_WEBP; cutinEl.hidden = false; }
  if (!showCutin && !cutinEl.hidden) cutinEl.hidden = true;
}
function draw() {
  var w = canvas.width, h = canvas.height;
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  var cam = renderer.camera;
  /* zoom = world units per screen px (OrthoCamera: visible world = viewport * zoom).
     Contain-fit the 1580x720 design frame: world-per-px = max of both axes. */
  cam.zoom = Math.max(DESIGN_W / w, DESIGN_H / h);
  cam.position.set(0, 0, 0);
  if (cam.update) cam.update();
  renderer.begin();
  for (var i = 0; i < rigs.length; i++) {
    if (rigs[i].hidden) continue;
    renderer.drawSkeleton(rigs[i].sk, true);
  }
  renderer.end();
}
function syncSize() {
  var w = canvas.clientWidth | 0, h = canvas.clientHeight | 0;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var bw = (w * dpr) | 0, bh = (h * dpr) | 0;
  if (w > 3 && h > 3 && (bw !== canvas.width || bh !== canvas.height)) {
    canvas.width = bw; canvas.height = bh;
    gl.viewport(0, 0, bw, bh);
    /* keep the camera projection in sync (renderer.resize does this normally) */
    if (renderer.camera.setViewport) renderer.camera.setViewport(bw, bh);
    else { renderer.camera.viewportWidth = bw; renderer.camera.viewportHeight = bh; }
  }
}
function ui() {
  document.getElementById("seek").value = String(Math.round(t / TOTAL * 1000) || 0);
  document.getElementById("time").textContent = t.toFixed(2) + " / " + TOTAL.toFixed(2) + "s";
}
function loop(now) {
  requestAnimationFrame(loop);
  if (!ready) return;
  syncSize();
  if (playing) {
    t += Math.min(now - last, 250) / 1000;
    last = now;
    if (t >= TOTAL) t -= TOTAL;
    seek(t);
  }
  draw();
  ui();
}
document.getElementById("play").addEventListener("click", function () {
  playing = !playing;
  last = performance.now();
  this.innerHTML = playing ? "\u275a\u275a" : "\u25b6";
});
document.getElementById("seek").addEventListener("input", function (e) {
  playing = false;
  document.getElementById("play").innerHTML = "\u25b6";
  seek(Number(e.target.value) / 1000 * TOTAL);
});
canvas.addEventListener("click", function () {
  playing = !playing;
  last = performance.now();
  document.getElementById("play").innerHTML = playing ? "\u275a\u275a" : "\u25b6";
});
</script>
</body>
</html>
