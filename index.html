<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CZN Animation Viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#111; color:#D6D6D6; font:13px/1.4 system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { background:#111; border-bottom:1px solid rgba(255,255,255,.08);
           padding:12px 18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; z-index:5; }
  h1 { font-size:15px; margin:0 8px 0 0; font-weight:600; }
  input#q { background:#1d1d1d; border:1px solid rgba(255,255,255,.12); border-radius:6px;
            color:#D6D6D6; padding:7px 10px; width:200px; font:13px system-ui; }
  input#q:focus { outline:none; border-color:#3D6AFF; }
  select#sort { background:#1d1d1d; border:1px solid rgba(255,255,255,.12); border-radius:6px;
                color:#D6D6D6; padding:6px 8px; font:13px system-ui; cursor:pointer; }
  select#sort:focus { outline:none; border-color:#3D6AFF; }
  .chip { background:#1d1d1d; border:1px solid rgba(255,255,255,.12); border-radius:999px;
          padding:5px 12px; cursor:pointer; color:#9A9A9A; user-select:none; }
  .chip.on { color:#fff; border-color:#3D6AFF; background:#1a2340; }
  #count { margin-left:auto; color:#8C8C8C; }
  #cols { flex:1; min-height:0; display:flex; }
  main { flex:1; min-width:0; overflow-y:auto; display:grid; align-content:start;
         grid-auto-rows:max-content;   /* auto rows + overflow:hidden items collapse to 2px in Chrome */
         grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px; padding:16px; }
  a.card { display:block; background:#181818; border:1px solid rgba(255,255,255,.07);
           border-radius:8px; overflow:hidden; text-decoration:none; color:inherit; }
  a.card:hover { border-color:#3D6AFF; background:#1d1d1d; }
  a.card.sel { border-color:#3D6AFF; background:#1a2340; }
  .thumb { height:128px; display:flex; align-items:center; justify-content:center; background:#0d0d0d; }
  .thumb img { max-width:100%; max-height:100%; display:block; }
  .letter { font-size:30px; color:#4A4A4A; font-weight:600; }
  .meta { padding:7px 9px; }
  .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
  .sub { color:#8C8C8C; font-size:11px; margin-top:2px; display:flex; gap:6px; align-items:center; }
  .sub .id { margin-right:auto; }
  .badge { border:1px solid rgba(255,255,255,.14); border-radius:4px; padding:0 5px; font-size:10px;
           line-height:15px; color:#9A9A9A; text-transform:uppercase; letter-spacing:.3px; }
  .badge.k-cutin { color:#C9A7FF; border-color:#5b3d8f; }
  .badge.k-gacha { color:#FFC96B; border-color:#8f6b2f; }
  .badge.k-event { color:#7FD4A8; border-color:#2f6f4f; }
  .badge.k-skin { color:#FF9BC2; border-color:#8f2f5b; }
  #subrow { display:none; gap:6px; }
  #subrow.show { display:flex; border-left:1px solid rgba(255,255,255,.22); margin-left:6px; padding-left:12px; }
  #rolerow { display:flex; gap:6px; border-left:1px solid rgba(255,255,255,.22); margin-left:6px; padding-left:12px; }
  #subrow .chip { padding:3px 10px; font-size:12px; }
  aside { width:46%; min-width:420px; max-width:58%; border-left:1px solid rgba(255,255,255,.08);
          display:flex; flex-direction:column; background:#141414; }
  @media (max-width: 900px) { aside { display:none; } }
  #sideHead { height:42px; display:flex; align-items:center; gap:8px; padding:0 12px;
              border-bottom:1px solid rgba(255,255,255,.08); }
  #sideTitle { font-weight:600; color:#D6D6D6; flex:1; white-space:nowrap; overflow:hidden;
               text-overflow:ellipsis; }
  #sideClose { background:none; border:none; color:#8C8C8C; font-size:15px; cursor:pointer; padding:4px 6px; }
  #sideClose:hover { color:#fff; }
  #sideBody { flex:1; min-height:0; position:relative; background: var(--czn-bg, #0d0d0d); }
  #sideBody iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  #sideBody img { position:absolute; inset:0; margin:auto; max-width:100%; max-height:100%; }
  /* animated-webp player: canvas + seekable timeline (native <img> cannot seek) */
  #wp { position:absolute; inset:0; display:flex; flex-direction:column; }
  #wpc { flex:1; min-height:0; width:100%; object-fit:contain; cursor:pointer; background:#0d0d0d; }
  #wpb { flex:none; height:38px; display:flex; align-items:center; gap:10px; padding:0 10px;
         background:#141414; border-top:1px solid rgba(255,255,255,.08); }
  #wpPlay { flex:none; width:28px; height:24px; background:#1d1d1d; border:1px solid rgba(255,255,255,.12);
            border-radius:5px; color:#D6D6D6; font-size:11px; cursor:pointer; }
  #wpSeek { flex:1; min-width:60px; accent-color:#3D6AFF; cursor:pointer; }
  #wpTime { flex:none; color:#8C8C8C; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #wpDl { flex:none; background:#1d1d1d; border:1px solid rgba(255,255,255,.12); border-radius:5px;
          color:#D6D6D6; padding:3px 8px; font-size:12px; text-decoration:none; }
  #wpRec { flex:none; width:28px; height:24px; background:#1d1d1d; border:1px solid rgba(255,255,255,.12);
           border-radius:5px; color:#D6D6D6; font-size:11px; cursor:pointer; }
  #wpb select { flex:none; background:#1d1d1d; border:1px solid rgba(255,255,255,.12); border-radius:5px;
                color:#D6D6D6; padding:3px 4px; font-size:12px; }
  #sideHint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
              color:#5A5A5A; text-align:center; padding:20px; }
</style>
</head>
<body>
<header>
  <h1>CZN Animation Viewer</h1>
  <input id="q" placeholder="Search id / name...">
  <span class="chip on" data-k="all">All</span>
  <span class="chip" data-k="portrait">Portrait</span>
  <span class="chip" data-k="model">Model</span>
  <span class="chip" data-k="battle">Battle</span>
  <span class="chip" data-k="event">Event</span>
  <span class="chip" data-k="skin">Skin</span>
  <span class="chip" data-k="cutin">Cutin</span>
  <span class="chip" data-k="gacha">Gacha</span>
  <span id="rolerow">
    <span class="chip on" data-r="all">Role: All</span>
    <span class="chip" data-r="Playable">Playable</span>
    <span class="chip" data-r="Support">Support</span>
    <span class="chip" data-r="Other">Other</span>
  </span>
  <span id="subrow">
    <span class="chip on" data-s="all">All</span>
    <span class="chip" data-s="fhd">FHD</span>
    <span class="chip" data-s="collapse">Collapse</span>
    <span class="chip" data-s="ux">UX</span>
    <span class="chip" data-s="special">Special</span>
    <span class="chip" data-s="art">Art</span>
  </span>
  <select id="sort" title="Sort by">
    <option value="id">Sort: ID</option>
    <option value="name">Sort: Name</option>
  </select>
  <span id="count"></span>
</header>
<div id="cols">
  <main id="grid"></main>
  <aside>
    <div id="sideHead">
      <span id="sideTitle">Preview</span>
      <button id="sideClose" title="Close">&#10005;</button>
    </div>
    <div id="sideBody"><div id="sideHint">Select an item to preview</div></div>
  </aside>
</div>
<script>
"use strict";
var DATA = [], kind = "all", sub = "all", role = "all";
/* Character role by name - derived from pack data: Playable = card+cutin kit,
   Support = supporter_skill kit, Other = story NPC / misc. */
var ROLE = {
  "Adelheid":"Playable", "Alcea":"Support", "Amir":"Playable", "Anika":"Playable", "Arabella":"Playable",
  "Aria":"Support", "Asteria":"Support", "Beryl":"Playable", "Blackrabbit":"Support", "Briah":"Support",
  "Carl":"Other", "Cassius":"Playable", "Chizuru":"Playable", "Clara":"Support", "Diana":"Playable",
  "Eloise":"Support", "Emily":"Support", "Encounter":"Other", "Erica":"Support", "Eunie":"Support",
  "Fei":"Playable", "Haru":"Playable", "Heidemarie":"Playable", "Hilde":"Playable", "Hugo":"Playable",
  "Itsuku":"Support", "Ivy":"Support", "Kayron":"Playable", "Khalipe":"Playable", "Kiara":"Support",
  "Licinia":"Support", "Lilian":"Support", "Louis":"Other", "Lucas":"Playable", "Luke":"Playable",
  "Magna":"Playable", "Maria":"Other", "Marianne":"Support", "Mei Lin":"Playable", "Mika":"Playable",
  "Millia":"Other", "Mob":"Other", "Monster":"Other", "Narzya":"Playable", "Nia":"Playable",
  "Nine":"Playable", "Noel":"Support", "Olga":"Playable", "Orlea":"Playable", "Owen":"Playable",
  "Peco":"Support", "Rei":"Playable", "Renoa":"Playable", "Rita":"Playable", "Ritochika":"Support",
  "Ruchet":"Other", "Ruixiang":"Support", "Rynn":"Playable", "Sarah":"Other", "Selena":"Playable",
  "Sereniel":"Playable", "Solia":"Other", "Sophia":"Support", "Sylvia":"Support", "Tenebria":"Playable",
  "Tiana":"Support", "Tipera":"Playable", "Trisa":"Playable", "Veronica":"Playable", "Westmacot":"Support",
  "Yuki":"Playable"
};
var grid = document.getElementById("grid");
var countEl = document.getElementById("count");
var q = document.getElementById("q");
var sideBody = document.getElementById("sideBody");
var sideTitle = document.getElementById("sideTitle");
var subrow = document.getElementById("subrow");
var sortEl = document.getElementById("sort");
var current = null;
var sortMode = localStorage.getItem("czn_sort") || "id";
sortEl.value = sortMode;

function label(r) {
  return r.name || (r.id ? "ID " + r.id : r.slug.replace(/_/g, " "));
}
function href(r) {
  return r.kind === "portrait" || r.kind === "model" || r.kind === "battle" || r.kind === "event" || r.kind === "skin"
    ? "viewer.html?m=rigs/" + r.slug
    : "cutins/" + r.slug + ".webp";
}
function idNum(r) {
  var m = String(r.id).match(/\d+/);
  return m ? parseInt(m[0], 10) : 1e9;   /* id-less entries (gacha/specials) sort last */
}
/* Default order: numeric id, so a character's rigs + cutins land together. */
function orderRows(rows) {
  var c = rows.slice();
  if (sortMode === "name") {
    c.sort(function (a, b) {
      var an = (a.name || "").toLowerCase(), bn = (b.name || "").toLowerCase();
      if (!an && bn) return 1;
      if (an && !bn) return -1;
      return an < bn ? -1 : an > bn ? 1 : (idNum(a) - idNum(b) || (a.slug < b.slug ? -1 : 1));
    });
  } else {
    c.sort(function (a, b) { return idNum(a) - idNum(b) || (a.slug < b.slug ? -1 : 1); });
  }
  return c;
}
function render() {
  var s = q.value.trim().toLowerCase();
  var rows = orderRows(DATA.filter(function (r) {
    if (kind !== "all" && r.kind !== kind) return false;
    if (kind === "cutin" && sub !== "all" && r.subtype !== sub) return false;
    if (role !== "all" && ROLE[r.name] !== role) return false;
    return !s ||
      String(r.id).indexOf(s) !== -1 ||
      (r.name || "").toLowerCase().indexOf(s) !== -1 ||
      (r.subtype || "").indexOf(s) !== -1 ||
      r.slug.indexOf(s) !== -1;
  }));
  countEl.textContent = rows.length + " / " + DATA.length;
  grid.innerHTML = "";
  rows.forEach(function (r) {
    var a = document.createElement("a");
    a.className = "card";
    a.href = href(r);
    var face = r.thumb ? '<img loading="lazy" src="' + r.thumb + '" alt="">'
                       : '<span class="letter">' + (String(r.id).replace(/\D/g, "").slice(-2) || "?") + "</span>";
    var badgeSub = (r.subtype && r.subtype !== r.kind)
      ? '<span class="badge">' + r.subtype + "</span>" : "";
    a.innerHTML = '<div class="thumb">' + face + '</div>' +
      '<div class="meta"><div class="nm">' + label(r) + '</div>' +
      '<div class="sub"><span class="id">#' + (r.id || "-") + '</span>' +
      '<span class="badge k-' + r.kind + '">' + r.kind + "</span>" + badgeSub + "</div></div>";
    if (current && current.slug === r.slug && current.kind === r.kind) a.classList.add("sel");
    a.addEventListener("click", function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      e.preventDefault();
      open(r);
    });
    grid.appendChild(a);
  });
}
/* ---- animated-webp player (ImageDecoder + canvas): play/pause + seekable timeline ---- */
var wp = { dec:null, starts:null, dur:0, idx:-1, t:0, playing:false, raf:0, last:0, gen:0 };

function stopWp() {
  wp.gen++;
  if (wp.raf) { cancelAnimationFrame(wp.raf); wp.raf = 0; }
  if (wp.dec) { try { wp.dec.close(); } catch (e) {} }
  wp.dec = null; wp.starts = null; wp.dur = 0; wp.idx = -1; wp.playing = false;
}
function wpIdxAt(t) {
  var s = wp.starts, lo = 0, hi = s.length - 2;
  while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (s[mid] <= t) lo = mid; else hi = mid - 1; }
  return Math.max(0, lo);
}
function wpDraw(i) {
  if (!wp.dec || i === wp.idx) return;
  wp.idx = i;
  var g = wp.gen;
  wp.dec.decode({ frameIndex: i }).then(function (res) {
    if (g !== wp.gen) { res.image.close(); return; }
    var im = res.image, c = document.getElementById("wpc");
    if (!c) { im.close(); return; }
    if (c.width !== im.displayWidth || c.height !== im.displayHeight) {
      c.width = im.displayWidth; c.height = im.displayHeight;
    }
    c.getContext("2d").drawImage(im, 0, 0);
    im.close();
  }).catch(function () {});
  wpUi();
}
function wpUi() {
  var seek = document.getElementById("wpSeek"), lbl = document.getElementById("wpTime");
  if (!seek || !wp.starts || !wp.dur) return;
  seek.value = String(Math.round(wp.t / wp.dur * 1000) || 0);
  lbl.textContent = (wp.t / 1000).toFixed(2) + " / " + (wp.dur / 1000).toFixed(2) + "s \u00b7 f" +
                    (wp.idx + 1) + "/" + (wp.starts.length - 1);
}
function wpPlay(on) {
  var b = document.getElementById("wpPlay");
  wp.playing = on;
  if (b) b.textContent = on ? "\u275a\u275a" : "\u25b6";
  if (on) { wp.last = performance.now(); if (!wp.raf) wp.raf = requestAnimationFrame(wpTick); }
  else if (wp.raf) { cancelAnimationFrame(wp.raf); wp.raf = 0; }
}
function wpTick(now) {
  if (!wp.playing) return;
  wp.t += Math.min(now - wp.last, 250);   /* clamp: rAF pause (hidden tab) must not jump-play */
  wp.last = now;
  if (wp.t >= wp.dur) wp.t -= wp.dur;                 /* loop */
  wpDraw(wpIdxAt(wp.t));
  wp.raf = requestAnimationFrame(wpTick);
}
function recWp(slug) {
  /* one clean loop -> .webm (live wallpapers / video edits); the raw animated
     webp keeps transparency and stays available via the webp link. */
  var c = document.getElementById("wpc"), btn = document.getElementById("wpRec");
  if (!c || !wp.starts || !wp.dur || !window.MediaRecorder) return;
  if (wp.rec) { wp.rec.stop(); return; }                 /* second click stops early */
  var mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
    ? "video/webm;codecs=vp9" : "video/webm";
  var mbEl = document.getElementById("wpMbps");
  var mbps = (mbEl && parseInt(mbEl.value, 10)) || 20;
  wp.rec = new MediaRecorder(c.captureStream(60), { mimeType: mime, videoBitsPerSecond: mbps * 1e6 });
  wp.recChunks = [];
  wp.rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) wp.recChunks.push(ev.data); };
  wp.rec.onstop = function () {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(wp.recChunks, { type: "video/webm" }));
    a.download = slug + ".webm";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    wp.rec = null;
    if (btn) { btn.style.color = ""; btn.textContent = "\uD83C\uDFA5"; }
  };
  wp.t = 0; wp.idx = -1; wpDraw(0); wpPlay(true);        /* restart for a seamless loop */
  wp.rec.start();
  if (btn) { btn.style.color = "#E06C6C"; btn.textContent = "\u25a0"; }
  setTimeout(function () { if (wp.rec) wp.rec.stop(); }, wp.dur + 150);   /* wp.dur is ms */
}
function openWp(slug) {
  var url = "cutins/" + slug + ".webp";
  if (!window.ImageDecoder || !slug) { sideBody.innerHTML = '<img src="' + url + '" alt="">'; return; }
  var g = ++wp.gen;                                   /* invalidates any in-flight load */
  sideBody.innerHTML =
    '<div id="wp"><canvas id="wpc"></canvas>' +
    '<div id="wpb"><button id="wpPlay" title="Play/Pause">\u275a\u275a</button>' +
    '<input type="range" id="wpSeek" min="0" max="1000" value="0">' +
    '<span id="wpTime">decoding\u2026</span>' +
    '<a id="wpDl" download title="Download the original animated WebP (keeps transparency)">webp</a>' +
    '<select id="wpMbps" title="Recording bitrate (Mbps)">' +
    '<option value="8">8M</option><option value="20" selected>20M</option>' +
    '<option value="35">35M</option><option value="60">60M</option></select>' +
    '<button id="wpRec" title="Record one loop as .webm">\uD83C\uDFA5</button></div></div>';
  document.getElementById("wpPlay").addEventListener("click", function () { wpPlay(!wp.playing); });
  document.getElementById("wpc").addEventListener("click", function () { wpPlay(!wp.playing); });
  document.getElementById("wpSeek").addEventListener("input", function (e) {
    if (!wp.dur || !wp.starts) return;
    wp.t = Number(e.target.value) / 1000 * wp.dur;
    wpDraw(wpIdxAt(wp.t));
  });
  document.getElementById("wpDl").href = url;
  var mb = document.getElementById("wpMbps");
  mb.value = localStorage.getItem("czn_recmbps") || "20";
  mb.addEventListener("change", function () { localStorage.setItem("czn_recmbps", mb.value); });
  document.getElementById("wpRec").addEventListener("click", function () { recWp(slug); });
  fetch(url).then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
    if (g !== wp.gen) return;
    var dec = new ImageDecoder({ data: buf, type: "image/webp" });
    wp.dec = dec;
    return dec.tracks.ready.then(function () {
      if (g !== wp.gen) return;
      var track = dec.tracks.selectedTrack, starts = [0], total = 0, i = 0;
      /* one pre-pass decode to read each frame's duration (PIL/ANMF timings) */
      function step() {
        var lbl = document.getElementById("wpTime");
        if (lbl && track.frameCount > 60 && (i % 20 === 0)) {
          lbl.textContent = "preparing\u2026 " + Math.round(i / track.frameCount * 100) + "%";
        }
        if (g !== wp.gen || i >= track.frameCount) return Promise.resolve();
        return dec.decode({ frameIndex: i }).then(function (res) {
          total += (res.image.duration || 33000) / 1000;
          starts.push(total);
          res.image.close();
          i++;
          return step();
        });
      }
      return step().then(function () {
        if (g !== wp.gen) return;
        wp.starts = starts; wp.dur = total || 1; wp.t = 0; wp.idx = -1;
        wpDraw(0);
        wpPlay(true);
      });
    });
  }).catch(function () {
    if (g === wp.gen) sideBody.innerHTML = '<img src="' + url + '" alt="">';
  });
}
function open(r) {
  current = r;
  sideTitle.textContent = label(r) + (r.id ? "  #" + r.id : "");
  stopWp();
  if (r.kind === "cutin" || r.kind === "gacha") {
    openWp(r.slug);
  } else {
    sideBody.innerHTML = '<iframe src="viewer.html?m=rigs/' + r.slug + '&embed=1" allowfullscreen></iframe>';
  }
  render();
}
function clearSide() {
  current = null;
  stopWp();
  sideTitle.textContent = "Preview";
  sideBody.innerHTML = '<div id="sideHint">Select an item to preview</div>';
  render();
}
document.getElementById("sideClose").addEventListener("click", clearSide);
document.addEventListener("keydown", function (e) { if (e.key === "Escape") clearSide(); });
document.querySelectorAll(".chip[data-k]").forEach(function (c) {
  c.addEventListener("click", function () {
    document.querySelectorAll(".chip[data-k]").forEach(function (x) { x.classList.remove("on"); });
    c.classList.add("on");
    kind = c.dataset.k;
    subrow.classList.toggle("show", kind === "cutin");
    render();
  });
});
document.querySelectorAll(".chip[data-s]").forEach(function (c) {
  c.addEventListener("click", function () {
    document.querySelectorAll(".chip[data-s]").forEach(function (x) { x.classList.remove("on"); });
    c.classList.add("on");
    sub = c.dataset.s;
    render();
  });
});
document.querySelectorAll(".chip[data-r]").forEach(function (c) {
  c.addEventListener("click", function () {
    document.querySelectorAll(".chip[data-r]").forEach(function (x) { x.classList.remove("on"); });
    c.classList.add("on");
    role = c.dataset.r;
    render();
  });
});
sortEl.addEventListener("change", function () {
  sortMode = sortEl.value;
  localStorage.setItem("czn_sort", sortMode);
  render();
});
q.addEventListener("input", render);
/* Same background color as the viewer's picker (set inside the iframe, mirrored
   here through localStorage + the storage event) so cut-ins / art / rigs all
   sit on the color you picked - e.g. green for keying. */
function applyBgVar() {
  document.documentElement.style.setProperty("--czn-bg", localStorage.getItem("czn_bg") || "#0d0d0d");
}
applyBgVar();
window.addEventListener("storage", function (e) { if (e.key === "czn_bg") applyBgVar(); });
fetch("index.json").then(function (r) { return r.json(); }).then(function (j) {
  DATA = (j.rigs || []).concat(j.cutins || []);
  render();
  var p = new URLSearchParams(location.search);
  var m = p.get("m"), c = p.get("c");
  if (m) {
    var rig = DATA.find(function (r) { return "rigs/" + r.slug === m; });
    if (rig) open(rig);
  } else if (c) {
    var cut = DATA.find(function (r) { return r.slug === c && (r.kind === "cutin" || r.kind === "gacha"); });
    if (cut) open(cut);
  }
});
</script>
</body>
</html>
