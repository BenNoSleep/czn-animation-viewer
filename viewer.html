<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>CZN Animation Viewer</title>
<style>
  html, body { margin:0; height:100%; background:#161616; overflow:hidden;
               font:12px Inter, system-ui, sans-serif; color:#8C8C8C; }
  #stage { position:absolute; inset:0 0 78px 0; overflow:hidden; }
  #c { width:100%; height:100%; display:block; cursor:grab; }
  #img { position:absolute; left:0; top:0; transform-origin:0 0; cursor:grab;
         user-select:none; -webkit-user-drag:none; }
  #msg { position:absolute; left:16px; top:14px; white-space:pre-wrap; max-width:80%; z-index:3; }
  #bar { position:absolute; left:10px; right:10px; bottom:8px;
         display:flex; flex-direction:column; }
  #bar[hidden] { display:none; }        /* id selector would beat the hidden attribute */
  .brow { display:flex; gap:9px; align-items:center; }
  .brow + .brow { margin-top:7px; padding-top:7px; border-top:1px solid rgba(255,255,255,.25); }
  .sep { flex:none; width:1px; height:18px; background:rgba(255,255,255,.28); margin:0 2px; }
  .right { display:flex; align-items:center; gap:9px; margin-left:auto; }
  #pngmsg { position:absolute; left:12px; bottom:88px; max-width:58%; z-index:6;
            color:#D6D6D6; background:rgba(27,27,27,0.9); border:1px solid rgba(255,255,255,0.14);
            border-radius:6px; padding:5px 9px; }
  #bar button { background:#232323; color:#D6D6D6; border:1px solid rgba(255,255,255,0.12);
                border-radius:6px; min-width:30px; height:26px; font:13px Inter, sans-serif; cursor:pointer; }
  #bar button:hover { background:#2C2C2C; }
  #bar select { background:#232323; color:#D6D6D6; border:1px solid rgba(255,255,255,0.12);
                border-radius:6px; padding:4px 8px; font:12px Inter, sans-serif; max-width:200px; }
  #bar select:focus { outline:none; border-color:#3D6AFF; }
  #seek { flex:1; min-width:60px; height:4px; accent-color:#3D6AFF; cursor:pointer; }
  #time { min-width:52px; text-align:center; color:#9A9A9A; }
  #anim { flex:1; max-width:190px; }
  #bgcol { width:34px; height:22px; padding:0; border:1px solid rgba(255,255,255,0.12);
           border-radius:4px; background:none; cursor:pointer; }
  #bar label { display:flex; align-items:center; gap:4px; cursor:pointer; }
  #zoomhint { position:absolute; right:12px; bottom:88px; color:#5A5A5A; }
  #layersPanel { position:absolute; right:10px; bottom:126px; width:212px; max-height:42vh; z-index:5;
                 display:flex; flex-direction:column; background:#1B1B1B; color:#C9C9C9;
                 border:1px solid rgba(255,255,255,0.14); border-radius:8px; overflow:hidden; }
  #layersPanel[hidden] { display:none; }   /* id selector beats the hidden attribute */
  .lp-head { display:flex; align-items:center; gap:8px; padding:7px 10px; font:600 12px Inter, sans-serif;
             border-bottom:1px solid rgba(255,255,255,0.09); }
  .lp-head span { flex:1; }
  .lp-head button { background:#232323; color:#D6D6D6; border:1px solid rgba(255,255,255,0.12);
                    border-radius:5px; padding:2px 8px; font-size:11px; cursor:pointer; }
  #lpList { flex:1; min-height:0; overflow-y:auto; padding:4px 0; }
  .lp-row { display:flex; align-items:center; gap:7px; padding:3px 10px; font-size:12px; cursor:pointer; }
  .lp-row:hover { background:rgba(255,255,255,0.05); }
  .lp-row input { accent-color:#3D6AFF; }
  #back { position:absolute; right:12px; top:12px; z-index:4; color:#9A9A9A; text-decoration:none;
          background:#232323; border:1px solid rgba(255,255,255,0.12); border-radius:6px; padding:5px 10px; }
  #back:hover { color:#fff; background:#2C2C2C; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><img id="img" alt="" hidden></div>
<a id="back" href="index.html">&#8592; All characters</a>
<div id="msg">Loading...</div>
<div id="pngmsg" hidden></div>
<div id="layersPanel" hidden>
  <div class="lp-head">
    <span>Layers</span>
    <button id="lpAll" title="Show every layer">all</button>
    <button id="lpNone" title="Hide every layer">none</button>
  </div>
  <div id="lpList"></div>
</div>
<div id="zoomhint" hidden>wheel: zoom &middot; drag: pan &middot; double-click: fit</div>
<div id="bar" hidden>
  <div class="brow">
    <button id="play" title="Play / Pause">&#10074;&#10074;</button>
    <input id="seek" type="range" min="0" max="1000" value="0" title="Timeline">
    <span id="time">0.0 / 0.0 s</span>
    <select id="speed" title="Playback speed">
      <option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="0.75">0.75x</option>
      <option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option>
    </select>
    <label title="Loop the animation"><input id="loop" type="checkbox" checked>loop</label>
    <select id="anim" title="Animation" style="visibility:hidden"></select>
  </div>
  <div class="brow">
    <label title="Background color - pick green/blue and key it out in your editor"><input id="bgcol" type="color" value="#000000">bg</label>
    <span class="sep"></span>
    <select id="recres" title="Recording resolution (the render is redone at this size - vector, not upscaled)">
      <option value="0">Win</option>
      <option value="1080" selected>1080p</option>
      <option value="1440">1440p</option>
      <option value="2160">4K</option>
    </select>
    <select id="recmbps" title="Recording bitrate (Mbps)">
      <option value="8">8M</option>
      <option value="20" selected>20M</option>
      <option value="35">35M</option>
      <option value="60">60M</option>
    </select>
    <button id="rec" title="Record one animation loop as .webm">&#127909;</button>
    <span class="right"><span class="sep"></span>
      <input id="pngin" type="file" accept="image/png,image/webp,image/*" style="display:none">
      <button id="pngbtn" title="Preview a modded texture PNG on this rig">PNG</button>
      <button id="pngreload" title="Reload the PNG from disk - after editing it in an image editor, preview the new version">&#8635;</button>
      <button id="layers" title="Show / hide individual layers (slots)">Layers</button>
    </span>
  </div>
</div>
<script src="spine-webgl.js"></script>
<script>
"use strict";
const msg = document.getElementById("msg");
const canvas = document.getElementById("c");
const imgEl = document.getElementById("img");
const bar = document.getElementById("bar");
const params = new URLSearchParams(location.search);
const model = params.get("m") || "";
const imgSrc = params.get("img") || "";
if (params.get("embed")) {        // embedded in the index side panel: hide the back link
  const _b = document.getElementById("back");
  if (_b) _b.style.display = "none";
}
function fail(t) { msg.style.display = "block"; msg.style.color = "#E06C6C"; msg.textContent = String(t); }
window.addEventListener("error", function (e) { fail(e.message); });

if (imgSrc) {
  /* ---------- image mode: zoom / pan ---------- */
  document.getElementById("zoomhint").hidden = false;
  let z = 1, px = 0, py = 0, drag = null;
  const apply = function () {
    imgEl.style.transform = "translate(" + px + "px," + py + "px) scale(" + z + ")";
  };
  const fit = function () {
    const sw = imgEl.naturalWidth, sh = imgEl.naturalHeight;
    const st = document.getElementById("stage");
    if (!sw || !sh) return;
    z = Math.min(st.clientWidth / sw, st.clientHeight / sh) * 0.96;
    px = (st.clientWidth - sw * z) / 2;
    py = (st.clientHeight - sh * z) / 2;
    imgEl.style.width = sw + "px";
    imgEl.style.height = sh + "px";
    apply();
  };
  imgEl.onload = function () { fit(); msg.style.display = "none"; };
  imgEl.onerror = function () { fail("Cannot load image: " + imgSrc); };
  imgEl.addEventListener("wheel", function (e) {
    e.preventDefault();
    const nz = Math.max(0.05, Math.min(8, z * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
    px = e.offsetX - (e.offsetX - px) * (nz / z);
    py = e.offsetY - (e.offsetY - py) * (nz / z);
    z = nz;
    apply();
  }, { passive: false });
  imgEl.addEventListener("pointerdown", function (e) {
    drag = [e.clientX, e.clientY, px, py];
    imgEl.setPointerCapture(e.pointerId);
    imgEl.style.cursor = "grabbing";
  });
  imgEl.addEventListener("pointermove", function (e) {
    if (!drag) return;
    px = drag[2] + e.clientX - drag[0];
    py = drag[3] + e.clientY - drag[1];
    apply();
  });
  imgEl.addEventListener("pointerup", function () {
    drag = null;
    imgEl.style.cursor = "grab";
  });
  imgEl.addEventListener("dblclick", fit);
  window.addEventListener("resize", fit);
  imgEl.hidden = false;
  imgEl.src = imgSrc;
} else {
  /* ---------- spine mode: media player ---------- */
  const gl = canvas.getContext("webgl", { alpha: false, premultipliedAlpha: true,
                                          preserveDrawingBuffer: true });
  if (!gl) { fail("WebGL is not available in this environment."); }
  const renderer = new spine.webgl.SceneRenderer(canvas, gl);
  const manager = new spine.webgl.AssetManager(gl, model + "/");
  manager.loadText("skeleton.atlas");
  manager.loadTextureAtlas("skeleton.atlas");
  if (params.get("bin") === "1") {
    manager.loadBinary("skeleton.skel");
  }

  let skeleton = null, animationState = null, paused = false, seeking = false, names = [];
  const isBin = params.get("bin") === "1";
  window.__viewer = { canvas, gl, fitToDrawn,           // QA/debug hook (block-scoped vars)
                      get renderer() { return renderer; },
                      get skeleton() { return skeleton; },
                      get animationState() { return animationState; },
                      setPaused: function (v) { paused = !!v; },
                      seek: function (t) {
                        if (!animationState) return;
                        animationState.trackTime = t;   // entries derive trackTime from the state
                        animationState.update(0);
                        animationState.apply(skeleton);
                      } };
  const animSel = document.getElementById("anim");
  const seek = document.getElementById("seek");
  const timeLbl = document.getElementById("time");
  const playBtn = document.getElementById("play");
  const loopCb = document.getElementById("loop");
  /* background color: clear color for every frame; persisted, shared with the
     index side panel via localStorage (storage event -> --czn-bg). */
  const bgcol = document.getElementById("bgcol");
  bgcol.value = localStorage.getItem("czn_bg") || "#000000";
  function clearBG() {
    const n = parseInt(bgcol.value.slice(1), 16) || 0;
    gl.clearColor((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }
  bgcol.oninput = function () { localStorage.setItem("czn_bg", bgcol.value); };
  /* per-layer visibility: a slot's alpha is stomped to 0 after every animation
     apply, so hidden layers stay hidden whatever the animation does (and the
     recorded webm matches what you see). */
  const hiddenSlots = new Set();
  const lpList = document.getElementById("lpList");
  const layersPanel = document.getElementById("layersPanel");
  function buildLayers() {
    lpList.innerHTML = "";
    skeleton.slots.forEach(function (s, i) {
      const row = document.createElement("label");
      row.className = "lp-row";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !hiddenSlots.has(i);
      cb.onchange = function () { cb.checked ? hiddenSlots.delete(i) : hiddenSlots.add(i); };
      const nm = document.createElement("span");
      const an = s.data.attachmentName;
      nm.textContent = s.data.name + (an && an !== s.data.name ? "  (" + an + ")" : "");
      row.appendChild(cb);
      row.appendChild(nm);
      lpList.appendChild(row);
    });
  }
  document.getElementById("layers").onclick = function () {
    /* a compact floating menu - no canvas resize, no extra dark area appears */
    layersPanel.hidden = !layersPanel.hidden;
  };
  document.getElementById("lpAll").onclick = function () { hiddenSlots.clear(); buildLayers(); };
  document.getElementById("lpNone").onclick = function () {
    skeleton.slots.forEach(function (_s, i) { hiddenSlots.add(i); });
    buildLayers();
  };
  function applyHidden() {
    /* restore slots zeroed last frame to the alpha captured the moment they were
       hidden (exact even while paused mid-animation - the setup alpha can differ
       from what the animation had), then zero the hidden ones. */
    if (!skeleton) return;
    stomped.forEach(function (i) {
      const s = skeleton.slots[i];
      if (s && s.color) s.color.a = savedAlpha.has(i) ? savedAlpha.get(i) : s.data.color.a;
    });
    stomped.clear();
    hiddenSlots.forEach(function (i) {
      const s = skeleton.slots[i];
      if (s && s.color) {
        savedAlpha.set(i, s.color.a);
        s.color.a = 0;
        stomped.add(i);
      }
    });
  }
  const stomped = new Set();
  const savedAlpha = new Map();
  /* preview a modded texture PNG: swap it in as the atlas page texture (pages
     AND regions - regions cache the texture reference at load). The czn-target
     text chunk stamped by the mod tool is read and matched against this rig. */
  const pngin = document.getElementById("pngin");
  const pngmsg = document.getElementById("pngmsg");
  let pngTimer = 0;
  let pngHandle = null;   /* FileSystemFileHandle of the picked PNG - re-read on Reload */
  function pngNote(t) {
    pngmsg.textContent = t;
    pngmsg.hidden = false;
    clearTimeout(pngTimer);
    pngTimer = setTimeout(function () { pngmsg.hidden = true; }, 8000);
  }
  function pngTag(bytes) {
    try {
      const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      let off = 8;
      while (off + 12 <= bytes.byteLength) {
        const len = dv.getUint32(off);
        const type = String.fromCharCode(bytes[off + 4], bytes[off + 5], bytes[off + 6], bytes[off + 7]);
        if (type === "tEXt") {
          let s = "";
          for (let i = 0; i < len && off + 8 + i < bytes.byteLength; i++) s += String.fromCharCode(bytes[off + 8 + i]);
          const z = s.indexOf("\0");
          if (z >= 0 && s.slice(0, z) === "czn-target") return s.slice(z + 1);
        }
        if (type === "IEND") break;
        off += 12 + len;
      }
    } catch (e) { /* not a PNG / malformed chunk */ }
    return null;
  }
  document.getElementById("pngbtn").onclick = function () {
    if (window.showOpenFilePicker) {
      window.showOpenFilePicker({
        types: [{ description: "Images", accept: { "image/*": [".png", ".webp", ".jpg", ".jpeg"] } }]
      }).then(function (hs) {
        pngHandle = hs[0];
        return hs[0].getFile();
      }).then(applyPngFile).catch(function () { /* cancelled */ });
    } else {
      pngin.click();                       // Firefox / Safari: plain input, no handle
    }
  };
  document.getElementById("pngreload").onclick = function () {
    if (pngHandle) {
      pngHandle.getFile().then(applyPngFile)          // fresh bytes from disk on every call
        .catch(function () { pngHandle = null; pngin.click(); });
    } else {
      pngin.click();                       // nothing picked yet: pick now
    }
  };
  pngin.onchange = function () {
    const f = pngin.files && pngin.files[0];
    pngin.value = "";
    if (f) applyPngFile(f);
  };
  function applyPngFile(f) {
    if (!f) return;
    f.arrayBuffer().then(function (buf) {
      const tag = pngTag(new Uint8Array(buf));
      const url = URL.createObjectURL(new Blob([buf], { type: f.type || "image/png" }));
      const img = new Image();
      img.onload = function () {
        const cv = document.createElement("canvas");
        cv.width = img.naturalWidth;
        cv.height = img.naturalHeight;
        const ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0);
        try {                                  // premultiply: matches the site's pages
          const id = ctx.getImageData(0, 0, cv.width, cv.height);
          const d = id.data;
          for (let i = 0; i < d.length; i += 4) {
            const a = d[i + 3];
            if (a < 255) { d[i] = d[i] * a / 255; d[i + 1] = d[i + 1] * a / 255; d[i + 2] = d[i + 2] * a / 255; }
          }
          ctx.putImageData(id, 0, 0);
        } catch (e) { /* canvas unreadable - ship the un-premultiplied image */ }
        const atlas = manager.get("skeleton.atlas");
        if (!atlas || !atlas.pages || !atlas.pages.length) { pngNote("no atlas page to replace"); return; }
        const tex = new spine.webgl.GLTexture(gl, cv);
        atlas.pages.forEach(function (p) {
          if (p.texture && p.texture !== tex) { try { p.texture.dispose(); } catch (e) {} }
          p.texture = tex;
          p.width = cv.width;
          p.height = cv.height;
        });
        (atlas.regions || []).forEach(function (rg) { rg.texture = tex; });
        const ent = animationState && animationState.getCurrent(0);
        if (ent) { ent.trackTime = 0; animationState.update(0); animationState.apply(skeleton); }
        URL.revokeObjectURL(url);
        const slug = model.split("/").pop() || "";
        let hint = "";
        if (tag) {
          const base = tag.split("/").pop().replace(/\.sct$/i, "");
          const want = /^face\/portrait\//.test(tag) ? "portrait_" + base
                     : /^model\//.test(tag) ? "model_" + base : null;
          hint = want ? (want === slug ? "  ·  matches this rig" : "  ·  open " + want + " to preview")
                      : "  ·  no rig page on the site";
        }
        pngNote("PNG " + cv.width + "\u00d7" + cv.height +
                (tag ? "  ·  " + tag + hint : "  ·  no czn-target tag"));
      };
      img.onerror = function () { URL.revokeObjectURL(url); pngNote("cannot read that image"); };
      img.src = url;
    });
  };
  /* record the current animation as one clean loop -> .webm. Resolution preset:
     the canvas is temporarily resized and the camera refit, so the file is a
     true vector render at that size (not an upscale). Second click stops early;
     the file downloads on stop. */
  const recRes = document.getElementById("recres");
  const recMbps = document.getElementById("recmbps");
  recRes.value = localStorage.getItem("czn_recres") || "1080";
  recMbps.value = localStorage.getItem("czn_recmbps") || "20";
  recRes.onchange = function () { localStorage.setItem("czn_recres", recRes.value); };
  recMbps.onchange = function () { localStorage.setItem("czn_recmbps", recMbps.value); };
  const recBtn = document.getElementById("rec");
  let rec = null, recChunks = [];
  recBtn.onclick = function () {
    if (rec) { rec.stop(); return; }
    if (!animationState || !skeleton || !window.MediaRecorder) return;
    const e = animationState.getCurrent(0);
    const dur = e && e.animation.duration ? e.animation.duration : 5;
    const W0 = canvas.width, H0 = canvas.height;
    const rh = parseInt(recRes.value, 10) || 0;
    if (rh) {                                  /* 16:9 preset render */
      const rw = Math.round(rh * 16 / 9);
      canvas.width = rw; canvas.height = rh;
      renderer.camera.setViewport(rw, rh);
      gl.viewport(0, 0, rw, rh);
      fitCamera();
    }
    const restore = function () {
      canvas.width = W0; canvas.height = H0;
      renderer.camera.setViewport(W0, H0);
      gl.viewport(0, 0, W0, H0);
      fitCamera();
    };
    const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
      ? "video/webm;codecs=vp9" : "video/webm";
    rec = new MediaRecorder(canvas.captureStream(60), {
      mimeType: mime, videoBitsPerSecond: (parseInt(recMbps.value, 10) || 20) * 1e6 });
    recChunks = [];
    rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) recChunks.push(ev.data); };
    rec.onstop = function () {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(recChunks, { type: "video/webm" }));
      a.download = (model.split("/").pop() || "rig") + "-" + (e ? e.animation.name : "anim") + ".webm";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      rec = null; recBtn.style.color = ""; recBtn.innerHTML = "&#127909;";
      restore();
    };
    if (e) { e.trackTime = 0; animationState.update(0); animationState.apply(skeleton); }
    rec.start();
    recBtn.style.color = "#E06C6C"; recBtn.innerHTML = "&#9632;";
    setTimeout(function () { if (rec) rec.stop(); }, dur * 1000 + 150);
  };

  function fitCamera() {
    if (!skeleton) return;
    /* NOTE: no renderer.resize() here - it would force the backing store back to
       the window size and break the recording resolution presets. The backing
       store is managed by setup() + the window resize listener. */
    if (animationState) {           // portrait rigs draw wildly differently from their setup pose
      animationState.update(0);
      animationState.apply(skeleton);
    }
    skeleton.updateWorldTransform();
    const off = new spine.Vector2(), size = new spine.Vector2();
    skeleton.getBounds(off, size);
    const vw = renderer.camera.viewportWidth, vh = renderer.camera.viewportHeight;
    if (size.x > 0 && size.y > 0 && vw > 0 && vh > 0) {
      renderer.camera.zoom = Math.max(size.x / vw, size.y / vh) * 1.12;
    }
    renderer.camera.position.set(off.x + size.x / 2, off.y + size.y / 2, 0);
    if (renderer.camera.update) renderer.camera.update();
    fitToDrawn();          // skeleton bounds can lie (invisible far attachments) - measure pixels
  }

  function fitToDrawn() {
    // One probe render, then refit the camera to the pixels that actually got drawn.
    clearBG();
    renderer.begin();
    renderer.drawSkeleton(skeleton, true);
    renderer.end();
    const w = canvas.width, h = canvas.height;
    if (w < 4 || h < 4) return;
    const px = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    // portrait rigs often carry a faint full-canvas layer - threshold adaptively
    // off the strongest pixel so the bbox lands on the real art, not that layer.
    let maxd = 0;
    for (let i = 0; i < px.length; i += 4) {
      const d = px[i] + px[i + 1] + px[i + 2];
      if (d > maxd) maxd = d;
    }
    if (maxd < 36) return;                      // nothing meaningful drawn
    const thr = Math.max(36, maxd * 0.25);
    let minX = w, minY = h, maxX = -1, maxY = -1;
    for (let y = 0; y < h; y++) {
      const row = y * w * 4;
      for (let x = 0; x < w; x++) {
        const i = row + x * 4;
        const d = px[i] + px[i + 1] + px[i + 2];
        if (d > thr) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0 || maxX - minX < 4 || maxY - minY < 4) return;
    const cam = renderer.camera, z = cam.zoom;
    const wx0 = (minX - w / 2) * z + cam.position.x;
    const wx1 = (maxX + 1 - w / 2) * z + cam.position.x;
    const wy0 = (minY - h / 2) * z + cam.position.y;
    const wy1 = (maxY + 1 - h / 2) * z + cam.position.y;
    cam.position.set((wx0 + wx1) / 2, (wy0 + wy1) / 2, 0);
    cam.zoom = Math.max((wx1 - wx0) / w, (wy1 - wy0) / h) * 1.1;
    if (cam.update) cam.update();
    clearBG();
  }

  function setAnim(i) {
    if (!names.length) return;
    i = (i + names.length) % names.length;
    animSel.selectedIndex = i;
    paused = false;
    playBtn.innerHTML = "&#10074;&#10074;";
    animationState.setAnimation(0, names[i], loopCb.checked);
    seek.value = 0;
  }

  function wireView() {
    // wheel: zoom about the cursor - drag: pan - double-click: fit
    const cam = renderer.camera;
    canvas.addEventListener("wheel", function (e) {
      e.preventDefault();
      const z0 = cam.zoom;
      const nz = Math.max(z0 / 8, Math.min(z0 * 8, z0 * (e.deltaY < 0 ? 1 / 1.15 : 1.15)));
      const rect = canvas.getBoundingClientRect();
      const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const sy = (e.clientY - rect.top) * (canvas.height / rect.height);
      const gx = sx - canvas.width / 2, gy = (canvas.height - sy) - canvas.height / 2;
      const wx = gx * z0 + cam.position.x, wy = gy * z0 + cam.position.y;
      cam.zoom = nz;
      cam.position.set(wx - gx * nz, wy - gy * nz, 0);
      cam.update();
    }, { passive: false });
    let pan = null;
    canvas.addEventListener("pointerdown", function (e) {
      pan = [e.clientX, e.clientY, cam.position.x, cam.position.y];
      try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetic events */ }
      canvas.style.cursor = "grabbing";
    });
    canvas.addEventListener("pointermove", function (e) {
      if (!pan) return;
      const rect = canvas.getBoundingClientRect();
      cam.position.set(pan[2] - (e.clientX - pan[0]) * (canvas.width / rect.width) * cam.zoom,
                       pan[3] + (e.clientY - pan[1]) * (canvas.height / rect.height) * cam.zoom, 0);
      cam.update();
    });
    canvas.addEventListener("pointerup", function () {
      pan = null;
      canvas.style.cursor = "grab";
    });
    canvas.addEventListener("dblclick", fitCamera);
  }

  function wireControls(data) {
    bar.hidden = false;
    names = (data.animations || []).map(function (a) { return a.name; });
    if (names.length > 0) {
      animSel.style.visibility = "visible";
      names.forEach(function (n) {
        const o = document.createElement("option");
        o.value = n; o.textContent = n;
        animSel.appendChild(o);
      });
      const li = names.indexOf("lobby");   /* excursion/liveevent rigs: 'lobby' is the idle loop */
      setAnim(li >= 0 ? li : 0);           /* their scene anims (1_intro_play...) start on an empty stage */
    }
    playBtn.onclick = function () {
      paused = !paused;
      playBtn.innerHTML = paused ? "&#9654;&#65038;" : "&#10074;&#10074;";
    };
    animSel.onchange = function () { setAnim(animSel.selectedIndex); };
    seek.addEventListener("pointerdown", function () { seeking = true; });
    seek.addEventListener("pointerup", function () { seeking = false; });
    seek.addEventListener("input", function () {
      const e = animationState.getCurrent(0);
      if (!e) return;
      e.trackTime = (seek.value / 1000) * e.animation.duration;
      animationState.update(0);
      animationState.apply(skeleton);
    });
    document.getElementById("speed").onchange = function () {
      animationState.timeScale = parseFloat(this.value);
    };
    loopCb.onchange = function () {
      const e = animationState.getCurrent(0);
      if (e) e.loop = loopCb.checked;
    };
  }

  function loadSkeletonJson() {
    /* skeleton.json can ship pre-gzipped under the same name (Cloudflare Pages
       caps files at 25 MiB) - detect the gzip magic and decompress in-browser. */
    return fetch(model + "/skeleton.json").then(function (res) {
      if (!res.ok) throw new Error("skeleton.json: HTTP " + res.status);
      return res.arrayBuffer();
    }).then(function (buf) {
      var bytes = new Uint8Array(buf);
      if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        return new Response(stream).arrayBuffer().then(function (out) { return new Uint8Array(out); });
      }
      return bytes;
    }).then(function (bytes) {
      return JSON.parse(new TextDecoder().decode(bytes));
    });
  }

  async function setup() {
    if (manager.hasErrors && manager.hasErrors()) {
      const errs = manager.getErrors();          /* spine-webgl 3.8: {path: message} */
      fail("Asset load failed:\n" + Object.keys(errs).map(function (k) {
        return k + ": " + errs[k];
      }).join("\n"));
      return;
    }
    const atlas = manager.get("skeleton.atlas");
    let data;
    if (isBin) {
      data = new spine.SkeletonBinary(new spine.AtlasAttachmentLoader(atlas))
        .readSkeletonData(new Uint8Array(manager.get("skeleton.skel")));
    } else {
      data = new spine.SkeletonJson(new spine.AtlasAttachmentLoader(atlas))
        .readSkeletonData(await loadSkeletonJson());
    }
    skeleton = new spine.Skeleton(data);
    const baseSkin = skeleton.data.findSkin ? skeleton.data.findSkin("normal") : null;
    if (baseSkin) {              // expression skins swap the face in; "default" lacks it
      skeleton.setSkin(baseSkin);
      skeleton.setSlotsToSetupPose();
    }
    animationState = new spine.AnimationState(new spine.AnimationStateData(data));
    wireControls(data);
    wireView();
    document.getElementById("zoomhint").hidden = false;
    msg.style.display = "none";
    renderer.resize(spine.webgl.ResizeMode.Expand);   // backing store -> window size
    buildLayers();
    fitCamera();
  }

  function boot() {
    if (!manager.isLoadingComplete()) { requestAnimationFrame(boot); return; }
    setup().catch(function (e) { fail(e && e.message ? e.message : String(e)); });
  }

  let last = performance.now();
  function frame() {
    requestAnimationFrame(frame);
    const now = performance.now();
    const delta = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (animationState && !paused) {
      animationState.update(delta);
      animationState.apply(skeleton);
      const e = animationState.getCurrent(0);
      if (e) {
        const d = e.animation.duration;
        if (!e.loop && e.trackTime >= d) {          // end of a one-shot: hold the last pose
          e.trackTime = d;
          paused = true;
          playBtn.innerHTML = "&#9654;&#65038;";
        }
        const t = e.loop ? e.trackTime % d : Math.min(e.trackTime, d);   // looped trackTime grows past d
        if (!seeking) seek.value = d > 0 ? Math.round(1000 * t / d) : 0;
        timeLbl.textContent = t.toFixed(1) + "/" + d.toFixed(1) + "s";
      }
    }
    applyHidden();        /* also while paused: layer toggles must apply immediately */
    if (!skeleton) return;
    skeleton.updateWorldTransform();
    clearBG();
    renderer.begin();
    renderer.drawSkeleton(skeleton, true);
    renderer.end();
  }

  window.addEventListener("resize", function () { renderer.resize(spine.webgl.ResizeMode.Expand); });
  requestAnimationFrame(boot);
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
